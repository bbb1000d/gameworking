version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: rogues
      POSTGRES_PASSWORD: rogues
      POSTGRES_DB: rogue_tier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://rogues:rogues@db:5432/rogue_tier
      JWT_SECRET: devsecret
      COOKIE_SECRET: devsecret
      PORT: 4000
    ports:
      - "4000:4000"
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
volumes:
  postgres-data:
